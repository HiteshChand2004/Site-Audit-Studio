<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas-rendered fixture</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  flutter-view, flt-glass-pane { display: block; position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<!-- Drawn the way a Flutter Web app draws a page: one full-window canvas inside flt-* elements, next to no DOM text. -->
<flutter-view>
  <flt-glass-pane>
    <flt-scene-host><canvas id="scene"></canvas></flt-scene-host>
  </flt-glass-pane>
  <flt-semantics-placeholder aria-hidden="true"></flt-semantics-placeholder>
</flutter-view>
<script>
  var c = document.getElementById('scene');
  c.width = c.clientWidth;
  c.height = c.clientHeight;
  var g = c.getContext('2d');
  g.fillStyle = '#1e293b';
  g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#f8fafc';
  g.font = '48px sans-serif';
  g.fillText('Welcome to the app', 80, 140);
  g.fillStyle = '#f97316';
  g.fillRect(80, 200, 220, 56);
</script>
</body>
</html>
