<?xml version="1.0" encoding="UTF-8"?>
<!-- Unsafe on purpose (Recreate 4a.5 sanitizer test): a script, an event handler, a javascript: link,
     an external image and an external stylesheet. None of it may reach the recreated site. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="16" height="16" viewBox="0 0 16 16" onload="window.parent.__svgFile = 1">
  <style>@import url(https://example.org/evil.css); circle { stroke: #0f766e; }</style>
  <script>window.parent.__svgFileScript = 1;</script>
  <a xlink:href="javascript:alert(1)"><circle cx="7" cy="7" r="5" fill="none" stroke-width="2"/></a>
  <line x1="11" y1="11" x2="15" y2="15" stroke="#0f766e" stroke-width="2"/>
  <image href="https://example.org/tracker.png" width="1" height="1"/>
</svg>
